<h2>Student Enrollment Request Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <div>
    <label>Student Name:</label>
    <input
      type="text"
      name="studentName"
      ngModel
      required
      minlength="3"
      #nameCtrl="ngModel">

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
      Name is required
    </span>

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
      Name must be at least 3 characters
    </span>
  </div>

  <br>

  <div>
    <label>Student Email:</label>
    <input
      type="email"
      name="studentEmail"
      ngModel
      required
      email>
  </div>

  <br>

  <div>
    <label>Course ID:</label>
    <input
      type="number"
      name="courseId"
      ngModel
      required>
  </div>

  <br>

  <div>
    <label>Preferred Semester:</label>
    <select name="preferredSemester" ngModel required>
      <option value="">Select Semester</option>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <br>

  <div>
    <label>
      <input
        type="checkbox"
        name="agreeToTerms"
        ngModel
        required>
      I agree to the terms
    </label>
  </div>

  <br>

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

  <button type="button" (click)="enrollForm.resetForm(); submitted=false">
    Reset
  </button>

  <div *ngIf="submitted && enrollForm.valid">
    <p>Enrollment request submitted successfully!</p>
  </div>

</form>
